  "1US 7RU 20EG 27ZA 30GR 31NL 32BE 33FR 34ES 36HU 39IT 40RO 41CH 43AT 44GB 45DK 46SE 47NO 48PL 49DE 51PE 52MX 53CU 54AR 55BR 56CL 57CO 58VE 60MY 61AU 62ID 63PH 64NZ 65SG 66TH 81JP 82KR 84VN 86CN 90TR 91IN 92PK 93AF 94LK 95MM 98IR 211SS 212MA 213DZ 216TN 218LY 220GM 221SN 222MR 223ML 224GN 225CI 226BF 227NE 228TG 229BJ 230MU 231LR 232SL 233GH 234NG 235TD 236CF 237CM 238CV 239ST 240GQ 241GA 242CG 243CD 244AO 245GW 248SC 249SD 250RW 251ET 252SO 253DJ 254KE 255TZ 256UG 257BI 258MZ 260ZM 261MG 262RE 263ZW 264NA 265MW 266LS 267BW 268SZ 269KM 291ER 297AW 298FO 299GL 350GI 351PT 352LU 353IE 354IS 355AL 356MT 357CY 358FI 359BG 370LT 371LV 372EE 373MD 374AM 375BY 376AD 377MC 378SM 380UA 381RS 382ME 383XK 385HR 386SI 387BA 389MK 420CZ 421SK 423LI 501BZ 502GT 503SV 504HN 505NI 506CR 507PA 509HT 591BO 592GY 593EC 595PY 597SR 598UY 673BN 675PG 679FJ 852HK 853MO 855KH 856LA 880BD 886TW 960MV 961LB 962JO 963SY 964IQ 965KW 966SA 967YE 968OM 970PS 971AE 972IL 973BH 974QA 975BT 976MN 977NP 992TJ 993TM 994AZ 995GE 996KG 998UZ".split(" ").forEach(function (t) { var m = t.match(/^(\d+)([A-Z]{2})$/); if (m) CC[m[1]] = m[2]; });
  function country(n) { n = String(n || ""); for (var L = 3; L >= 1; L--) if (CC[n.substr(0, L)]) return CC[n.substr(0, L)]; return ""; }
  function flag(c) { return c ? String.fromCodePoint(0x1F1E6 + c.charCodeAt(0) - 65, 0x1F1E6 + c.charCodeAt(1) - 65) : ""; }

  /* ---------- styled QR (same look as the printed card) ---------- */
  function drawQR(canvas, text, d) {
    var px = 220, dpr = window.devicePixelRatio || 1, cv = canvas;
    cv.width = px * dpr; cv.height = px * dpr;
    var g = cv.getContext("2d"); g.scale(dpr, dpr);
    var q = qrcode(0, "H"); q.addData(text); q.make();
    var n = q.getModuleCount(), pad = 26, cs = (px - 2 * pad) / n, mid = Math.floor(n / 2), half = Math.floor(n * 0.24 / 2);
    var dark = lum(d.colors.main) < 140 ? d.colors.main : "#1A1A1A";
    var eye = lum(d.colors.accent) < 170 ? d.colors.accent : dark;
    function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
    function finder(r, c) { return (r < 8 && c < 8) || (r < 8 && c >= n - 8) || (r >= n - 8 && c < 8); }
    g.fillStyle = dark;
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
      if (finder(r, c) || (Math.abs(r - mid) <= half && Math.abs(c - mid) <= half) || !q.isDark(r, c)) continue;
      rr(pad + c * cs + cs * .04, pad + r * cs + cs * .04, cs * .92, cs * .92, cs * .25); g.fill();
    }
    [[0, 0], [0, n - 7], [n - 7, 0]].forEach(function (f) {
      var X = pad + f[1] * cs, Y = pad + f[0] * cs;
      g.strokeStyle = eye; g.lineWidth = cs; rr(X + cs * .5, Y + cs * .5, cs * 6, cs * 6, cs * 1.6); g.stroke();
      g.fillStyle = dark; rr(X + cs * 2, Y + cs * 2, cs * 3, cs * 3, cs * .9); g.fill();
    });
    // scan corners (accent)
    g.strokeStyle = d.colors.accent; g.lineWidth = 5; g.lineCap = "round";
    [[10, 10, 1, 1], [px - 10, 10, -1, 1], [10, px - 10, 1, -1], [px - 10, px - 10, -1, -1]].forEach(function (k) {
      g.beginPath(); g.moveTo(k[0] + k[2] * 26, k[1]); g.lineTo(k[0], k[1]); g.lineTo(k[0], k[1] + k[3] * 26); g.stroke();
    });
    // logo in the middle
    var b = (2 * half + 1) * cs, cx = pad + mid * cs + cs / 2, cy = cx;
    g.fillStyle = "#fff"; rr(cx - b / 2, cy - b / 2, b, b, cs * 1.2); g.fill();
    var inner = b - cs * 1.4;
    if (d.logo) {
      var im = new Image();
      im.onload = function () {
        var s = Math.min(inner / im.width, inner / im.height);
        g.drawImage(im, cx - im.width * s / 2, cy - im.height * s / 2, im.width * s, im.height * s);
      };
      im.src = d.logo;
    } else {
      g.fillStyle = d.colors.main; rr(cx - inner / 2, cy - inner / 2, inner, inner, cs); g.fill();
      g.fillStyle = on(d.colors.main); g.font = "600 " + Math.round(inner * .42) + "px system-ui,sans-serif";
      g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(initials(d.company || d.name), cx, cy + 1);
    }
  }

  /* ---------- vCard (Save contact) ---------- */
  function fold(line) { var out = [], s = line; while (s.length > 74) { out.push(s.slice(0, 74)); s = " " + s.slice(74); } out.push(s); return out.join("\r\n"); }
  function ve(s) { return String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n"); }
  function saveContact(d) {
    var parts = String(d.name || "").trim().split(/\s+/), first = parts.shift() || "", last = parts.join(" ");
    var L = ["BEGIN:VCARD", "VERSION:3.0", "N:" + ve(last) + ";" + ve(first) + ";;;", "FN:" + ve(d.name)];
    if (d.company) L.push("ORG:" + ve(d.company));
    if (d.job) L.push("TITLE:" + ve(d.job));
    if (d.mobile) L.push("TEL;TYPE=CELL:+" + d.mobile);
    if (d.mobile2) L.push("TEL;TYPE=CELL:+" + d.mobile2);
    if (d.office) L.push("TEL;TYPE=WORK:+" + d.office);
    if (d.email) L.push("EMAIL;TYPE=INTERNET:" + d.email);
    if (d.website) L.push("URL:" + http(d.website));
    L.push("URL;TYPE=Smart Card:" + d.link);
    [["instagram", "https://instagram.com/"], ["facebook", "https://facebook.com/"], ["linkedin", "https://linkedin.com/in/"], ["tiktok", "https://tiktok.com/@"]].forEach(function (s) {
      if (d[s[0]]) L.push("X-SOCIALPROFILE;TYPE=" + s[0] + ":" + social(d[s[0]], s[1]));
    });
    if (d.photo) L.push(fold("PHOTO;ENCODING=b;TYPE=JPEG:" + d.photo.split(",")[1]));
    L.push("END:VCARD");
    var blob = new Blob([L.join("\r\n") + "\r\n"], { type: "text/vcard;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = (d.name || "contact").replace(/[\\\/:*?"<>|]/g, "") + ".vcf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }

  /* ---------- profile ---------- */
  function renderProfile(d) {
    var saved = null;
    try { saved = localStorage.getItem("sbc_lang_" + CARD); } catch (e) {}
    LANG = saved || (d.lang === "AR" ? "ar" : "en");
    var t = T[LANG];
    document.documentElement.lang = LANG;
    document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
    setColors(d.colors);
    document.title = d.name + " · Smart Business Card";
    var m = d.colors.main, a = d.colors.accent, bg = d.colors.bg;
    var tt = lum(a) < 200 ? a : m;
    function num(label, n) {
      var c = country(n);
      return '<a class="num" href="tel:+' + n + '"><div class="ic" style="background:' + grad(m, .15, -.1) + '">' + svg("call") +
             "</div><div><small>" + (c ? '<span class="flag">' + flag(c) + "</span> " + c + " · " : "") + label + "</small>" +
             '<b><bdi dir="ltr">' + esc(showPhone(n)) + '</bdi></b></div><div class="ch">' + (LANG === "ar" ? "‹" : "›") + "</div></a>";
    }
    function item(k, label, href) {
      return '<a class="it" href="' + esc(href) + '"' + (/^https?:/.test(href) ? ' target="_blank" rel="noopener"' : "") + '>' +
             '<div class="ci" style="background:' + grad(m, .18, -.3) + ";border:2px solid " + a + '">' + svg(k) + "</div><span>" + label + "</span></a>";
    }
    var nums = "";
    if (d.mobile) nums += num(t.mobile, d.mobile);
    if (d.mobile2) nums += num(t.mobile2, d.mobile2);
    if (d.office) nums += num(t.office, d.office);
    var g = [];
    if (d.mobile) g.push(item("wa", t.wa, "https://wa.me/" + d.mobile));
    if (d.email) g.push(item("mail", t.mail, "mailto:" + d.email));
    if (d.website) g.push(item("web", t.web, http(d.website)));
    if (d.location) g.push(item("pin", t.pin, http(d.location)));
    if (d.instagram) g.push(item("ig", t.ig, social(d.instagram, "https://instagram.com/")));
    if (d.facebook) g.push(item("fb", t.fb, social(d.facebook, "https://facebook.com/")));
    if (d.linkedin) g.push(item("li", t.li, social(d.linkedin, "https://linkedin.com/in/")));
    if (d.tiktok) g.push(item("tt", t.tt, social(d.tiktok, "https://tiktok.com/@")));
    var wallet = "";
    if (d.pass) {
      wallet = '<div class="wrow"><a class="lux wallet2" href="' + esc(d.pass) + '" target="_blank" rel="noopener">' + svg("wallet") +
               '<div class="tx">' + t.wallet + '<small>' + t.walletSub + '</small></div></a>' +
               (d.huawei ? '<a class="lux hw" href="' + esc(d.huawei) + '">' + svg("phone") + t.huawei + "</a>" : "") + "</div>";
    }
    app.innerHTML =
      '<div class="hero" style="background:linear-gradient(140deg,' + shade(m, .12) + " 0%," + m + " 45%," + shade(m, -.35) + ' 100%)">' +
        '<div class="lines"></div><div class="glow" style="background:radial-gradient(circle,' + a + ' 0%,transparent 65%)"></div>' +
        '<div class="lang"><button data-l="en"' + (LANG === "en" ? ' class="on"' : "") + '>EN</button><button data-l="ar"' + (LANG === "ar" ? ' class="on"' : "") + '>ع</button></div>' +
        // top: the logo on a white pill (readable for any logo colors). When the logo is already in the
        // circle (no photo), the top shows the company name instead, so the logo is not shown twice.
        '<div class="logo">' + (d.logo && d.photo ? '<span class="pill"><img alt="' + esc(d.company || "Logo") + '" src="' + d.logo + '"></span>'
                                       : '<div class="brand">' + esc((d.company || "ADLINKCARD").toUpperCase()) + "</div>") + "</div>" +
        '<svg class="wave" viewBox="0 0 330 62" preserveAspectRatio="none"><path d="M0 34 C 90 70, 240 0, 330 30 L330 62 L0 62 Z" fill="' + bg + '"/>' +
        '<path d="M0 40 C 100 72, 230 8, 330 38" fill="none" stroke="' + a + '" stroke-width="2"/></svg>' +
      "</div>" +
      // circle: the photo; no photo -> the client's logo on white; no logo either -> initials
      '<div class="ring" style="background:' + (!d.photo && d.logo ? "#fff" : grad(m, .15, -.2)) + ";color:" + on(m) +
        ";box-shadow:0 0 0 4px " + bg + ",0 0 0 7px " + a + ',0 10px 24px rgba(0,0,0,.28)">' +
        (d.photo ? '<img alt="' + esc(d.name) + '" src="' + d.photo + '">'
                 : d.logo ? '<img alt="' + esc(d.company || "Logo") + '" src="' + d.logo + '" style="object-fit:contain;padding:18px;box-sizing:border-box">'
                 : esc(initials(d.name))) + "</div>" +
      '<div class="nm" dir="auto">' + esc(d.name) + "</div>" +
      (d.job ? '<div class="tt" dir="auto" style="color:' + tt + '">' + esc(d.job) + "</div>" : "") +
      (d.company ? '<div class="co" dir="auto">' + esc(d.company) + "</div>" : "") +
      '<div class="divd"><i style="background:linear-gradient(90deg,transparent,' + a + ')"></i><b style="background:' + a + '"></b>' +
        '<i style="background:linear-gradient(90deg,' + a + ',transparent)"></i></div>' +
      nums +
      (g.length ? '<div class="grid">' + g.join("") + "</div>" : "") +
      '<div class="acts"><button class="lux" id="save" style="background:linear-gradient(140deg,' + shade(m, .1) + "," + shade(m, -.25) + ");color:" + on(m) +
        ";border:1.5px solid " + a + '">' + svg("save") + t.save + "</button>" + wallet + "</div>" +
      '<div class="share2" style="background:linear-gradient(140deg,' + shade(m, .1) + "," + shade(m, -.3) + ')"><div class="h">' + t.share + '</div>' +
        '<div class="tile"><canvas id="qr" aria-label="QR code of this card"></canvas></div>' +
        '<div class="hint">' + t.hint + '</div>' +
        '<button class="lux" id="shareBtn">' + svg("share") + t.send + "</button></div>" +
      '<div class="foot2">POWERED BY ADLINKCARD · GROW SMARTER</div>';
    document.getElementById("save").onclick = function () { saveContact(d); };
    Array.prototype.forEach.call(document.querySelectorAll(".lang button"), function (btn) {
      btn.onclick = function () {
        try { localStorage.setItem("sbc_lang_" + CARD, btn.getAttribute("data-l")); } catch (e) {}
        renderProfile(d);
      };
    });
    document.getElementById("shareBtn").onclick = function () {
      var b = this;
      if (navigator.share) { navigator.share({ title: d.name, url: d.link }).catch(function () {}); return; }
      navigator.clipboard.writeText(d.link).then(function () { b.lastChild.textContent = T[LANG].copied; }).catch(function () { prompt("Copy this link:", d.link); });
    };
    if (window.qrcode) drawQR(document.getElementById("qr"), d.link, d);
  }

  function showPhone(n) {             // 96170123456 -> +961 70 123 456
    n = String(n || "").replace(/\D/g, "");
    if (/^961\d{8}$/.test(n)) return "+961 " + n.substr(3, 2) + " " + n.substr(5, 3) + " " + n.substr(8, 3);
    if (/^961\d{7}$/.test(n)) return "+961 " + n.substr(3, 1) + " " + n.substr(4, 3) + " " + n.substr(7, 3);
    return "+" + n;
  }

  function loadProfile() {
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem("sbc_" + CARD) || "null"); } catch (e) {}
    if (cached && cached.ok) renderProfile(cached);
    fetch(API + "?api=profile&card=" + encodeURIComponent(CARD))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.ok) {
          try { localStorage.setItem("sbc_" + CARD, JSON.stringify(d)); } catch (e) {}
          if (!cached || JSON.stringify(cached) !== JSON.stringify(d)) renderProfile(d);
        } else {
          try { localStorage.removeItem("sbc_" + CARD); } catch (e) {}
          app.innerHTML = '<div class="head"><div class="brand">ADLINKCARD</div></div><div class="body">' +
            (d.reason === "inactive"
              ? msg("", "This card is not active at the moment.", "هذه البطاقة غير مفعّلة حالياً.")
              : msg("err", "This card link is not valid.", "رابط البطاقة غير صالح.")) + FOOT + "</div>";
        }
      })
      .catch(function () {
        if (!cached) app.innerHTML = '<div class="body" style="padding-top:40px">' +
          msg("err", "Could not load the card. Check your internet and try again.", "تعذّر تحميل البطاقة. تحقق من الإنترنت وحاول مجدداً.") + "</div>";
      });
  }

  /* ---------- photo upload (?c=...&k=...) ---------- */
  function loadPhotoPage() {
    fetch(API + "?api=check&card=" + encodeURIComponent(CARD) + "&k=" + encodeURIComponent(KEY))
      .then(function (r) { return r.json(); })
      .then(function (s) {
        if (!s.ok) { app.innerHTML = '<div class="body" style="padding-top:40px">' + msg("err", "This link is not valid.", "هذا الرابط غير صالح.") + FOOT + "</div>"; return; }
        app.innerHTML =
          '<div class="head"><div class="brand">YOUR CARD PHOTO</div><div class="ar" style="opacity:.85">صورة بطاقتك</div></div>' +
          '<div class="body"><div class="frame" id="frame">' + svg("save").replace("<svg", '<svg style="width:70px;fill:#1E2761;opacity:.3"') + "</div>" +
          '<h1 dir="auto">' + esc(s.name) + '</h1><div class="sub">' + esc(s.company) + "</div>" +
          (s.photo ? msg("", "A photo was already received. A new one will replace it.", "تم استلام صورة سابقاً. الصورة الجديدة ستستبدلها.") : "") +
          '<p style="font-size:14px;line-height:1.6">A clear photo of your face, looking at the camera.<br><span class="ar">صورة واضحة للوجه، النظر إلى الكاميرا.</span></p>' +
          '<label class="btn pick" for="file" tabindex="0" id="pickBtn">Choose photo | اختر صورة</label><input type="file" id="file" accept="image/*">' +
          '<button class="btn main" id="send" disabled>Upload photo | تحميل الصورة</button><div id="out"></div>' + FOOT + "</div>";
        var jpeg = null, out = document.getElementById("out"), send = document.getElementById("send");
        document.getElementById("pickBtn").onkeydown = function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); document.getElementById("file").click(); } };
        document.getElementById("file").onchange = function (ev) {
          var f = ev.target.files[0]; if (!f) return;
          jpeg = null; send.disabled = true; out.innerHTML = "";
          var img = new Image();
          img.onload = function () {
            var side = Math.min(img.naturalWidth, img.naturalHeight), S = Math.min(700, side);    // square crop, 700px
            var cv = document.createElement("canvas"); cv.width = S; cv.height = S;
            var cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, S, S);
            cx.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, S, S);
            var url = cv.toDataURL("image/jpeg", 0.85); jpeg = url.split(",")[1];
            document.getElementById("frame").innerHTML = '<img alt="Selected photo" src="' + url + '">';
            send.disabled = false; URL.revokeObjectURL(img.src);
          };
          img.onerror = function () { out.innerHTML = msg("err", "This photo format is not supported. Choose a JPG or PNG.", "صيغة الصورة غير مدعومة. اختر JPG أو PNG."); };
          img.src = URL.createObjectURL(f);
        };
        send.onclick = function () {
          if (!jpeg) return;
          send.disabled = true; send.textContent = "Uploading… | جارٍ التحميل…";
          fetch(API, { method: "POST", body: JSON.stringify({ action: "photo", card: CARD, k: KEY, img: jpeg }) })
            .then(function (r) { return r.json(); })
            .then(function (r) {
              send.textContent = "Upload photo | تحميل الصورة";
              if (r.ok) { out.innerHTML = msg("ok", "Photo received. Thank you! 🎉", "تم استلام الصورة. شكراً لكم!"); jpeg = null; try { localStorage.removeItem("sbc_" + CARD); } catch (e) {} }
              else { send.disabled = false; out.innerHTML = msg("err", "The photo was not uploaded. Please try again.", "لم يتم تحميل الصورة. حاول مجدداً."); }
            })
            .catch(function () { send.disabled = false; send.textContent = "Upload photo | تحميل الصورة"; out.innerHTML = msg("err", "Check your internet and tap Upload again.", "تحقق من الإنترنت واضغط تحميل مجدداً."); });
        };
      })
      .catch(function () { app.innerHTML = '<div class="body" style="padding-top:40px">' + msg("err", "Check your internet and try again.", "تحقق من الإنترنت وحاول مجدداً.") + "</div>"; });
  }

  if (/^[a-z0-9]{6}$/.test(CARD) && /^[a-f0-9]{10}$/.test(KEY)) loadPhotoPage();
  else if (/^[a-z0-9]{6}$/.test(CARD)) loadProfile();
  else app.innerHTML = '<div class="head"><div class="brand">ADLINKCARD</div><div style="opacity:.85;margin-top:4px">Smart Business Card · Grow Smarter</div></div><div class="body">' +
         msg("", "Scan a Smart Business Card to see its profile.", "امسح بطاقة الأعمال الذكية لعرض صفحتها.") + FOOT + "</div>";
</script>
</body>
